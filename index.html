      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('toolora-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Toolora",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "All",
        "description": "Free browser-side online tools platform for image editing, PDF manipulation, text utilities, developer encoding, calculators, and unit converters.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
